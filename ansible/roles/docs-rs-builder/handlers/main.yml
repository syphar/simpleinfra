---
- name: restart-docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  notify: restart-builder-host

- name: restart-builder-host
  ansible.builtin.systemd:
    name: docs-rs-builder-host
    state: restarted
    daemon_reload: true
  notify: restart-ecs

- name: restart-ecs
  ansible.builtin.systemd:
    name: ecs
    state: restarted
    daemon_reload: true
