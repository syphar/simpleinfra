---
- name: restart-docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: restart-ecs
  ansible.builtin.systemd:
    name: ecs
    state: restarted
    daemon_reload: true

- name: restart-docker-cleanup-timer
  ansible.builtin.systemd:
    name: prune-disk-space.timer
    state: restarted
    daemon_reload: true
