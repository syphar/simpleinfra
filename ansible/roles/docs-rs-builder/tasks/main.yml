---
- name: Validate builder configuration
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'
      - vars_ecs_cluster | length > 0
      - vars_builder_name | length > 0
    fail_msg: "This role requires Ubuntu 24.04 amd64, an ECS cluster, and a builder identity."

- name: Discover any legacy systemd builder
  ansible.builtin.service_facts:

- name: Stop and disable the legacy builder before enabling ECS
  ansible.builtin.systemd:
    name: builder
    state: stopped
    enabled: false
  when: "'builder.service' in ansible_facts.services"

- name: Remove the legacy application launcher and environment files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/builder.service
    - /usr/local/sbin/docs-rs-builder
    - /etc/docs-rs/builder.env
    - /run/docs-rs-builder
  notify: restart-ecs

- name: Install host dependencies
  ansible.builtin.apt:
    name: [ca-certificates, docker.io, iptables]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download the pinned gVisor package
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/pool/{{ vars_runsc_version }}/binary-amd64/runsc.deb"
    dest: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
    checksum: "sha256:{{ vars_runsc_sha256 }}"
    mode: '0644'

- name: Install gVisor
  ansible.builtin.apt:
    deb: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
  notify: restart-docker

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker and the gVisor runtime
  ansible.builtin.template:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart-docker

- name: Create persistent builder directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/ecs
    - /etc/systemd/system/ecs.service.d
    - "{{ vars_prefix_path }}"
    - "{{ vars_workspace_path }}"

- name: Install host isolation checks
  ansible.builtin.template:
    src: builder-host-checks
    dest: /usr/local/sbin/docs-rs-builder-host-checks
    mode: '0755'
  notify: restart-builder-host

- name: Install host readiness service
  ansible.builtin.template:
    src: builder-host.service
    dest: /etc/systemd/system/docs-rs-builder-host.service
    mode: '0644'
  notify: restart-builder-host

- name: Require host checks before registering with ECS
  ansible.builtin.template:
    src: ecs-override.conf
    dest: /etc/systemd/system/ecs.service.d/docs-rs.conf
    mode: '0644'
  notify: restart-ecs

- name: Configure the ECS agent
  ansible.builtin.template:
    src: ecs.config
    dest: /etc/ecs/ecs.config
    mode: '0644'
  notify: restart-ecs

- name: Download the pinned ECS-Init package
  ansible.builtin.get_url:
    url: "https://s3.{{ vars_aws_region }}.amazonaws.com/amazon-ecs-agent-{{ vars_aws_region }}/amazon-ecs-init-{{ vars_ecs_init_version }}.amd64.deb"
    dest: "/var/cache/amazon-ecs-init-{{ vars_ecs_init_version }}.deb"
    checksum: "sha256:{{ vars_ecs_init_sha256 }}"
    mode: '0644'

- name: Install the ECS agent
  ansible.builtin.apt:
    deb: "/var/cache/amazon-ecs-init-{{ vars_ecs_init_version }}.deb"
  notify: restart-ecs

- name: Apply host configuration changes
  ansible.builtin.meta: flush_handlers

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Start and enable host readiness checks
  ansible.builtin.systemd:
    name: docs-rs-builder-host
    state: started
    enabled: true
    daemon_reload: true

- name: Start and enable the ECS agent
  ansible.builtin.systemd:
    name: ecs
    state: started
    enabled: true
    daemon_reload: true
