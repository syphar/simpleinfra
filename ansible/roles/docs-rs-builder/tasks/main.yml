---
- name: Validate builder configuration
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'
      - vars_ecs_cluster | length > 0
      - vars_builder_name | length > 0
    fail_msg: "This role requires Ubuntu 24.04 amd64, an ECS cluster, and a builder identity."

- name: Install host dependencies
  ansible.builtin.apt:
    name: [ca-certificates, docker.io]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Download the pinned gVisor package
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/pool/{{ vars_runsc_version }}/binary-amd64/runsc.deb"
    dest: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
    checksum: "sha256:{{ vars_runsc_sha256 }}"
    mode: '0644'

- name: Install gVisor
  ansible.builtin.apt:
    deb: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
  notify: restart-docker

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker and the gVisor runtime
  ansible.builtin.template:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart-docker

- name: Apply Docker configuration before testing gVisor
  ansible.builtin.meta: flush_handlers

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Verify gVisor can run a container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --runtime=runsc
      - --network=none
      - public.ecr.aws/docker/library/alpine:3.22
      - "true"
  changed_when: false

- name: Create persistent builder directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/ecs
    - "{{ vars_prefix_path }}"
    - "{{ vars_workspace_path }}"

- name: Allow ECS task credentials through the common host firewall
  ansible.builtin.template:
    src: ecs-firewall.sh
    dest: /etc/firewall/ecs.sh
    mode: '0755'
  notify: reload-firewall

- name: Configure the ECS agent
  ansible.builtin.template:
    src: ecs.config
    dest: /etc/ecs/ecs.config
    mode: '0644'
  notify: restart-ecs

# Provisioning runs inside cloud-final. Own the unit ordering so starting ECS
# cannot wait for cloud-final to finish while Ansible waits for registration.
- name: Install the ECS service without a cloud-final dependency
  ansible.builtin.template:
    src: ecs.service
    dest: /etc/systemd/system/ecs.service
    mode: '0644'
  notify: restart-ecs

- name: Download the pinned ECS-Init package
  ansible.builtin.get_url:
    url: "https://s3.{{ vars_aws_region }}.amazonaws.com/amazon-ecs-agent-{{ vars_aws_region }}/amazon-ecs-init-{{ vars_ecs_init_version }}.amd64.deb"
    dest: "/var/cache/amazon-ecs-init-{{ vars_ecs_init_version }}.deb"
    checksum: "sha256:{{ vars_ecs_init_sha256 }}"
    mode: '0644'

- name: Install the ECS agent
  ansible.builtin.apt:
    deb: "/var/cache/amazon-ecs-init-{{ vars_ecs_init_version }}.deb"
    policy_rc_d: 101
  notify: restart-ecs

- name: Apply host configuration changes
  ansible.builtin.meta: flush_handlers

- name: Start and enable the ECS agent
  ansible.builtin.systemd:
    name: ecs
    state: started
    enabled: true
    daemon_reload: true

# ECS owns application startup; registration must work even before an image is published.
- name: Wait for registration with the expected ECS cluster
  ansible.builtin.uri:
    url: http://127.0.0.1:51678/v1/metadata
    return_content: true
    use_proxy: false
    timeout: 5
  register: ecs_registration
  until:
    - ecs_registration.status | default(0) == 200
    - (ecs_registration.json | default({})).ContainerInstanceArn | default('') | length > 0
    - ((ecs_registration.json | default({})).Cluster | default('')).split('/')[-1] == vars_ecs_cluster
  retries: 60
  delay: 5

- name: Install daily Docker cleanup units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: '0644'
  loop:
    - prune-disk-space.service
    - prune-disk-space.timer
  notify: restart-docker-cleanup-timer

- name: Enable daily Docker cleanup
  ansible.builtin.systemd:
    name: prune-disk-space.timer
    state: started
    enabled: true
    daemon_reload: true
