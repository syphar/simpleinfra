---
- name: Validate builder configuration
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version == '24.04'
      - ansible_architecture == 'x86_64'
      - vars_builder_image | length > 0
      - vars_s3_bucket | length > 0
    fail_msg: "This role requires Ubuntu 24.04 amd64, an ECR image, and a storage bucket."

- name: Install host dependencies
  ansible.builtin.apt:
    name: [ca-certificates, docker.io, iptables, python3-venv]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install AWS CLI in a dedicated virtual environment
  ansible.builtin.pip:
    name: "awscli=={{ vars_awscli_version }}"
    virtualenv: /opt/docs-rs/awscli
    virtualenv_command: /usr/bin/python3 -m venv

- name: Download the pinned gVisor package
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/gvisor/releases/pool/{{ vars_runsc_version }}/binary-amd64/runsc.deb"
    dest: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
    checksum: "sha256:{{ vars_runsc_sha256 }}"
    mode: '0644'

- name: Install gVisor
  ansible.builtin.apt:
    deb: "/var/cache/runsc-{{ vars_runsc_version }}.deb"
  notify: restart-docker

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: Configure Docker and the gVisor runtime
  ansible.builtin.template:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart-docker

- name: Create persistent builder directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/docs-rs
    - "{{ vars_prefix_path }}"
    - "{{ vars_workspace_path }}"

- name: Install builder environment
  ansible.builtin.template:
    src: builder.env
    dest: /etc/docs-rs/builder.env
    mode: '0600'
  notify: restart-builder

- name: Install builder launcher
  ansible.builtin.template:
    src: builder-launcher
    dest: /usr/local/sbin/docs-rs-builder
    mode: '0755'
  notify: restart-builder

- name: Configure systemd service
  ansible.builtin.template:
    src: builder.service
    dest: /etc/systemd/system/builder.service
    mode: '0644'
  notify: restart-builder

# Apply Docker changes before attempting to launch containers.
- name: Apply service configuration changes
  ansible.builtin.meta: flush_handlers

- name: Start and enable Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Start and enable builder
  ansible.builtin.systemd:
    name: builder
    state: started
    enabled: true
    daemon_reload: true
