---
vars_aws_region: us-east-1
# Set the full ECR image reference in inventory. Prefer an immutable SHA or digest.
vars_builder_image: ""
vars_database_parameter: /docs-rs/database-url
vars_github_token_parameter: /docs-rs/github-access-token
vars_s3_bucket: ""
vars_prefix_path: /opt/docs-rs/prefix
vars_workspace_path: /opt/docs-rs/workspace
vars_toolchain: nightly
vars_build_cpu_limit: 1
# Leave room for the host and builder on the 4 GiB staging instance.
vars_build_memory_limit: 2147483648
vars_builder_stop_timeout: 300
vars_awscli_version: "1.46.1"
# Complete package, including gVisor helper binaries; checksum from its release index.
vars_runsc_version: "20261012.0"
vars_runsc_sha256: 7a440a035128a52f489b0bb76f60ac4df9cabe7cdf31dd5fd79a3e80f8a707ca
vars_builder_environment: {}
